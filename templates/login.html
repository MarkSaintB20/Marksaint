<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Marksaint Vault</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark text-light d-flex align-items-center" style="min-height: 100vh">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card shadow">
            <div class="card-body">
              <h1 class="h4 text-center mb-3">Acesso seguro</h1>
              {% with messages = get_flashed_messages(with_categories=True) %}
              {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
              {% endfor %}
              {% endwith %}
              <form method="post">
                <div class="mb-3">
                  <label class="form-label">Senha administrativa</label>
                  <input type="password" class="form-control" name="password" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Token MFA</label>
                  <input type="text" class="form-control" name="otp" inputmode="numeric" required />
                  <div class="form-text">Configure o app autenticador usando MARKSAINT_TOTP_SECRET.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
